<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="m2-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="50%" stop-color="#211138"/>
      <stop offset="100%" stop-color="#3d1847"/>
    </linearGradient>
    <radialGradient id="voice-glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#m2-bg)"/>
  <circle cx="300" cy="180" r="150" fill="url(#voice-glow)"/>

  <!-- Soundwave Concentric Rings -->
  <circle cx="300" cy="180" r="40" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.8"/>
  <circle cx="300" cy="180" r="70" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="300" cy="180" r="100" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.4"/>

  <!-- Glowing Tulip Silhouette at Center -->
  <g transform="translate(300, 180) scale(0.8)">
    <path d="M 0 10 C -15 -10, -25 -30, 0 -45 C 25 -30, 15 -10, 0 10 Z" fill="#fb7185" filter="drop-shadow(0 0 8px #fb7185)"/>
    <path d="M -12 -15 C -25 -25, -20 -40, -5 -40" fill="none" stroke="#fef08a" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 35 0 45" stroke="#c084fc" stroke-width="2" fill="none"/>
  </g>
  
  <text x="300" y="375" font-family="'Cormorant Garamond', serif" font-size="20" fill="#fb7185" text-anchor="middle" letter-spacing="3">THE FIRST CALL</text>
</svg>
