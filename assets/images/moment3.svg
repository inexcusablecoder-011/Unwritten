<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="m3-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181028"/>
      <stop offset="60%" stop-color="#32174d"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#m3-bg)"/>
  
  <!-- Perspective winding road with glowing light trails & starlight -->
  <path d="M 300 160 L 0 400 L 600 400 Z" fill="#120d21"/>
  <path d="M 300 160 L 140 400 L 165 400 L 300 168 Z" fill="#c084fc" opacity="0.7" filter="drop-shadow(0 0 10px #c084fc)"/>
  <path d="M 300 160 L 460 400 L 435 400 L 300 168 Z" fill="#fb7185" opacity="0.7" filter="drop-shadow(0 0 10px #fb7185)"/>
  
  <!-- Starlight spark / Tulip motif in sky -->
  <circle cx="300" cy="110" r="40" fill="#f472b6" opacity="0.15" filter="drop-shadow(0 0 20px #f472b6)"/>
  <path d="M 300 130 C 290 115, 280 100, 300 85 C 320 100, 310 115, 300 130 Z" fill="#ffffff" opacity="0.9" filter="drop-shadow(0 0 8px #f472b6)"/>

  <text x="300" y="375" font-family="'Cormorant Garamond', serif" font-size="20" fill="#c084fc" text-anchor="middle" letter-spacing="3">THE BIKE RIDE &amp; LONG DRIVE</text>
</svg>
