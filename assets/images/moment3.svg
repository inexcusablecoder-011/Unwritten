<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="m3-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181028"/>
      <stop offset="60%" stop-color="#2d1b4d"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#m3-bg)"/>
  
  <!-- Perspective winding road with glowing trails -->
  <path d="M 300 180 L 0 400 L 600 400 Z" fill="#120d21"/>
  <path d="M 300 180 L 150 400 L 170 400 L 300 185 Z" fill="#a78bfa" opacity="0.6" filter="drop-shadow(0 0 8px #a78bfa)"/>
  <path d="M 300 180 L 450 400 L 430 400 L 300 185 Z" fill="#ec4899" opacity="0.6" filter="drop-shadow(0 0 8px #ec4899)"/>
  
  <text x="300" y="380" font-family="'Cormorant Garamond', serif" font-size="20" fill="#c084fc" text-anchor="middle" letter-spacing="3">THE SPONTANEOUS ROAD TRIP</text>
</svg>
